{% extends "main.html" %}

{% block content %}
<style>
  .mo-404 {
    text-align: center;
    padding: 6rem 2rem;
  }
  .mo-404-code {
    font-size: 6rem;
    font-weight: 800;
    background: var(--mo-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0;
    line-height: 1;
  }
  .mo-404 h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin: 1rem 0 0.5rem;
    border: none;
    padding: 0;
  }
  .mo-404 p {
    color: var(--md-default-fg-color--light);
    margin-bottom: 2rem;
  }
  .mo-404 a.mo-btn {
    display: inline-flex;
  }
</style>
<div class="mo-404">
  <div class="mo-404-code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <a href="{{ config.site_url }}" class="mo-btn mo-btn-primary" style="background: var(--md-accent-fg-color); color: #fff;">
    Back to Documentation
  </a>
</div>
{% endblock %}
