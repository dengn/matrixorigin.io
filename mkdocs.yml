site_name: MatrixOne Documentation
site_description: MatrixOne - Hyperconverged Cloud & Edge Native Database
site_url: https://docs.matrixorigin.cn
repo_name: matrixorigin/matrixone
repo_url: https://github.com/matrixorigin/matrixone

theme:
  name: material
  custom_dir: overrides
  logo: assets/new-logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: fontawesome/solid/note-sticky
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/lightbulb
      warning: fontawesome/solid/triangle-exclamation
      danger: fontawesome/solid/bolt
      example: fontawesome/solid/flask
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - header.autohide
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: mo-light
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: mo-dark
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

edit_uri: edit/main/docs/en/

extra_css:
  - stylesheets/extra.css

extra:
  homepage: https://www.matrixorigin.cn
  version:
    provider: mike
  alternate:
    - name: English
      link: https://docs.matrixorigin.io
      lang: en
    - name: 中文简体
      link: https://docs.matrixorigin.cn
      lang: zh
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/matrixorigin/matrixone
      name: GitHub
  generator: false

plugins:
  - search:
      separator: '[\s\-\.]+'
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - def_list
  - footnotes

